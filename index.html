document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius  <p style=\"margin: 4.4px 0 0; font-weight: 600; color: var(--color-neutral-600)\">Difficulty adjustments, learning analytics and privacy settings<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closePortal }}\" aria-label=\"Close\" style=\"width: 40px; height: 40px; border: none; border-radius: 999px; background: var(--color-surface); color: var(--color-neutral-700); font-size: 18px; font-weight: 800; flex-shrink: 0\">×<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ pinLocked }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 13.2px; text-align: center\">\n            <span style=\"width: 64px; height: 64px; border-radius: 999px; background: var(--color-accent-200); color: var(--color-accent-800); display: flex; align-items: center; justify-content: center\">\n              <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <h3 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 26px; margin: 0\">Grown-ups verification<\u002Fh3>\n            <p style=\"margin: 0; font-weight: 600; color: var(--color-neutral-600)\">Solve this math problem, or enter the PIN, to open settings.<\u002Fp>\n            <div style=\"width: 100%; background: var(--color-surface); border-radius: var(--radius-md); padding: 17.6px; font-family: var(--font-heading); font-size: 24px\">{{ gateQuestion }}<\u002Fdiv>\n            <input class=\"input\" type=\"number\" value=\"{{ gateAnswer }}\" sc-camel-on-change=\"{{ onGateAnswer }}\" placeholder=\"Enter answer\" style=\"border-radius: 999px; text-align: center; font-weight: 800; width: 100%\">\n            <span style=\"font-size: 13px; font-weight: 700; color: var(--color-neutral-500)\">Or enter the parent PIN (default 1234)<\u002Fspan>\n            <input class=\"input\" type=\"password\" inputmode=\"numeric\" value=\"{{ pinEntry }}\" sc-camel-on-change=\"{{ onPinChange }}\" placeholder=\"Parent PIN\" style=\"border-radius: 999px; text-align: center; font-weight: 800; width: 100%\">\n            <sc-if value=\"{{ pinError }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-weight: 800; color: var(--color-accent-700)\">That verification answer isn't right. Please try again.<\u002Fspan>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ submitPin }}\" class=\"btn btn-primary\" style=\"border-radius: 999px; font-weight: 800; width: 100%; padding: 13.2px\">Verify and open portal<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ pinUnlocked }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 26.4px\">\n            <div style=\"display: flex; gap: 8.8px; flex-wrap: wrap; border-bottom: 1px solid var(--color-divider); padding-bottom: 17.6px\">\n              <sc-for list=\"{{ portalTabs }}\" as=\"pt\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ pt.onClick }}\" style=\"{{ pt.style }}\">{{ pt.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ pAnalytics }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 17.6px\">\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 13.2px\">\n                  <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px\">\n                    <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-600)\">Total problems solved<\u002Fspan>\n                    <div style=\"font-family: var(--font-heading); font-size: 32px; line-height: 1.1; margin-top: 4.4px\">{{ totalSolved }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px\">\n                    <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-600)\">Overall accuracy<\u002Fspan>\n                    <div style=\"font-family: var(--font-heading); font-size: 32px; line-height: 1.1; margin-top: 4.4px; color: var(--color-accent-2-700)\">{{ accuracy }}%<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px\">\n                    <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-600)\">Longest streak<\u002Fspan>\n                    <div style=\"font-family: var(--font-heading); font-size: 32px; line-height: 1.1; margin-top: 4.4px; color: var(--color-accent-700)\">{{ bestStreak }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ hasWeakFacts }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background: var(--color-accent-100); border-radius: var(--radius-md); padding: 17.6px; display: flex; gap: 13.2px; align-items: flex-start\">\n                    <span style=\"color: var(--color-accent-700); flex-shrink: 0; margin-top: 2px\">\n                      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 8v4\"><\u002Fpath><path d=\"M12 16h.01\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fspan>\n                    <div>\n                      <h4 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 19px; color: var(--color-accent-800)\">Targeted practice recommendation<\u002Fh4>\n                      <p style=\"margin: 4.4px 0 0; font-size: 14px; font-weight: 700; color: var(--color-accent-800)\">{{ weakFactsText }}<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px\">\n                  <h4 style=\"margin: 0 0 13.2px; font-weight: 800; font-size: 15px\">Single-digit fact family performance<\u002Fh4>\n                  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8.8px\">\n                    <sc-for list=\"{{ factRows }}\" as=\"fr\" hint-placeholder-count=\"10\">\n                      <div style=\"background: var(--color-bg); border-radius: var(--radius-sm); padding: 13.2px; text-align: center\">\n                        <div style=\"font-weight: 800; font-size: 16px\">+{{ fr.digit }} facts<\u002Fdiv>\n                        <div style=\"{{ fr.accStyle }}\">{{ fr.accLabel }}<\u002Fdiv>\n                        <div style=\"font-size: 11px; font-weight: 700; color: var(--color-neutral-500)\">{{ fr.countLabel }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ pSettings }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 17.6px\">\n                <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px; display: flex; flex-direction: column; gap: 13.2px\">\n                  <h4 style=\"margin: 0; font-weight: 800; font-size: 16px\">Digit range and sum limits<\u002Fh4>\n                  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 13.2px\">\n                    <label class=\"field\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800\">\n                      Minimum digit\n                      <sc-raw-select class=\"input\" value=\"{{ minDigit }}\" sc-camel-on-change=\"{{ onMinDigit }}\" style=\"border-radius: 999px; font-weight: 700\">\n                        <option value=\"0\">0 (includes 0 + X)<\u002Foption>\n                        <option value=\"1\">1 (starts at 1)<\u002Foption>\n                      <\u002Fsc-raw-select>\n                    <\u002Flabel>\n                    <label class=\"field\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800\">\n                      Maximum digit\n                      <sc-raw-select class=\"input\" value=\"{{ maxDigit }}\" sc-camel-on-change=\"{{ onMaxDigit }}\" style=\"border-radius: 999px; font-weight: 700\">\n                        <option value=\"5\">5 (beginner: 0–5)<\u002Foption>\n                        <option value=\"9\">9 (full single digits: 0–9)<\u002Foption>\n                      <\u002Fsc-raw-select>\n                    <\u002Flabel>\n                    <label class=\"field\" style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800\">\n                      Maximum sum limit\n                      <sc-raw-select class=\"input\" value=\"{{ sumLimit }}\" sc-camel-on-change=\"{{ onSumLimit }}\" style=\"border-radius: 999px; font-weight: 700\">\n                        <option value=\"10\">Sums up to 10 (5 + 5)<\u002Foption>\n                        <option value=\"18\">Sums up to 18 (9 + 9)<\u002Foption>\n                      <\u002Fsc-raw-select>\n                    <\u002Flabel>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px; display: flex; flex-direction: column; gap: 13.2px\">\n                  <h4 style=\"margin: 0; font-weight: 800; font-size: 16px\">Question format and input mode<\u002Fh4>\n                  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8.8px\">\n                    <sc-for list=\"{{ modeOptions }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"{{ m.style }}\">\n                        <span style=\"font-weight: 800; font-size: 15px\">{{ m.label }}<\u002Fspan>\n                        <span style=\"{{ m.subStyle }}\">{{ m.sub }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px; display: flex; flex-direction: column; gap: 13.2px\">\n                  <h4 style=\"margin: 0; font-weight: 800; font-size: 16px\">Voice feedback and audio<\u002Fh4>\n                  <sc-for list=\"{{ toggles }}\" as=\"t\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.style }}\">\n                      <span>{{ t.label }}<\u002Fspan>\n                      <span style=\"{{ t.pillStyle }}\">{{ t.state }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                  <label style=\"display: flex; align-items: center; gap: 13.2px; font-weight: 700; font-size: 15px; background: var(--color-bg); border-radius: 999px; padding: 13.2px 17.6px\">\n                    <span style=\"width: 150px\">Speech speed: {{ voiceRateLabel }}<\u002Fspan>\n                    <input type=\"range\" min=\"0.7\" max=\"1.3 ; font-family: var(--font-heading); font-weight: 700; font-size: 24px; color: var(--color-accent-2-800)\">Child privacy and safety compliance<\u002Fh3>\n                    <p style=\"margin: 8.8px 0 0; font-size: 14px; font-weight: 700; color: var(--color-accent-2-800); line-height: 1.5\">Mr. Riehl’s Math Lab is built to child safety standards in line with COPPA and FERPA.<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 13.2px\">\n                  <sc-for list=\"{{ privacyCards }}\" as=\"pc\" hint-placeholder-count=\"4\">\n                    <div style=\"background: var(--color-neutral-100); border-radius: var(--radius-md); padding: 17.6px\">\n                      <span style=\"display: block; font-weight: 800; font-size: 15px; margin-bottom: 6px\">{{ pc.title }}<\u002Fspan>\n                      <span style=\"font-size: 13px; font-weight: 600; color: var(--color-neutral-700); line-height: 1.5\">{{ pc.body }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ badgeModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--color-neutral-900) 60%, transparent); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 17.6px\">\n      <div style=\"background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 420px; padding: 35.2px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 13.2px; animation: ms-in 0.25s ease-out\">\n        <span class=\"tag tag-accent\" style=\"font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase\">New badge unlocked<\u002Fspan>\n        <span style=\"width: 104px; height: 104px; border-radius: 999px; background: var(--color-accent); color: #fff; display: flex; align-items: center; justify-content: center; animation: ms-bob 2s ease-in-out infinite\">\n          <svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"6\"><\u002Fcircle><path d=\"M15.477 12.89 17 22l-5-3-5 3 1.523-9.11\"><\u002Fpath><\u002Fsvg>\n        <\u002Fspan>\n        <h3 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 32px; margin: 0\">{{ newBadgeTitle }}<\u002Fh3>\n        <p style=\"margin: 0; font-weight: 600; color: var(--color-neutral-700)\">{{ newBadgeDescription }}<\u002Fp>\n        <button sc-camel-on-click=\"{{ dismissBadge }}\" class=\"btn btn-primary\" style=\"border-radius: 999px; font-weight: 800; width: 100%; padding: 17.6px; font-size: 18px\">Collect it<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSplash }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 50; background: var(--color-bg); overflow: auto; padding: 52px 26.4px 70px\">\n      <div style=\"max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 35.2px\">\n\n        <div style=\"display: flex; align-items: center; gap: 17.6px; flex-wrap: wrap\">\n          <div style=\"width: 70px; height: 70px; border-radius: 999px; background: #fff; border: 2px solid var(--color-neutral-200); display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 var(--color-neutral-200); flex-shrink: 0; animation: ms-bob 4s ease-in-out infinite\">\n            <svg width=\"46\" height=\"46\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" aria-hidden=\"true\">\n            <defs><clipPath id=\"flaskSplash\"><circle cx=\"24\" cy=\"29\" r=\"12.6\"><\u002Fcircle><\u002FclipPath><\u002Fdefs>\n            <g clip-path=\"url(#flaskSplash)\">\n              <rect x=\"10\" y=\"15\" width=\"14\" height=\"14\" fill=\"#0a8a2a\"><\u002Frect>\n              <rect x=\"24\" y=\"15\" width=\"14\" height=\"14\" fill=\"#f5a623\"><\u002Frect>\n              <rect x=\"10\" y=\"29\" width=\"14\" height=\"14\" fill=\"#12556b\"><\u002Frect>\n              <rect x=\"24\" y=\"29\" width=\"14\" height=\"14\" fill=\"#cf0a2c\"><\u002Frect>\n            <\u002Fg>\n            <g stroke=\"#fff\" stroke-width=\"2.1\" stroke-linecap=\"round\">\n              <path d=\"M14.9 22.6h5.2M17.5 20v5.2\"><\u002Fpath>\n              <path d=\"M27.9 22.6h5.2\"><\u002Fpath>\n              <path d=\"M14.9 35.4h5.2\"><\u002Fpath>\n              <path d=\"M28.6 33.5 33.4 38.3M33.4 33.5 28.6 38.3\"><\u002Fpath>\n            <\u002Fg>\n            <circle cx=\"30.5\" cy=\"20.1\" r=\"1\" fill=\"#fff\"><\u002Fcircle>\n            <circle cx=\"30.5\" cy=\"25.1\" r=\"1\" fill=\"#fff\"><\u002Fcircle>\n            <g stroke=\"#0b0f2b\" stroke-linecap=\"round\" fill=\"none\">\n              <circle cx=\"24\" cy=\"29\" r=\"12.6\" stroke-width=\"3.2\"><\u002Fcircle>\n              <path d=\"M19.3 8.6v9.2M28.7 8.6v9.2\" stroke-width=\"3.2\"><\u002Fpath>\n              <path d=\"M17 7.4h14\" stroke-width=\"3.4\"><\u002Fpath>\n              <path d=\"M21.4 11.2h3M21.4 13.9h3.4\" stroke-width=\"1.7\"><\u002Fpath>\n            <\u002Fg>\n          <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"flex: 1; min-width: 260px\">\n            <h1 style=\"font-family: var(--font-heading); font-weight: 700; font-size: 46px; line-height: 1.05; margin: 0; letter-spacing: -0.015em\">Mr. Riehl’s Math Lab<\u002Fh1>\n            <p style=\"margin: 8.8px 0 0; font-size: 17px; font-weight: 600; color: var(--color-neutral-700)\">Pick a station to start practising<\u002Fp>\n          <\u002Fdiv>\n          <span class=\"tag tag-accent-2\" style=\"display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; white-space: nowrap\">\n            <span>Level {{ level }}<\u002Fspan>\n            <span style=\"opacity: 0.5\">·<\u002Fspan>\n            <span>{{ starsLabel }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 17.6px\">\n          <sc-for list=\"{{ stations }}\" as=\"st\" hint-placeholder-count=\"16\">\n            <button sc-camel-on-click=\"{{ st.onClick }}\" disabled=\"{{ st.disabled }}\" style=\"{{ st.style }}\">\n              <span style=\"{{ st.glyphStyle }}\">{{ st.glyph }}<\u002Fspan>\n              <span style=\"{{ st.titleStyle }}\">{{ st.title }}<\u002Fspan>\n              <sc-if value=\"{{ st.soon }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-600)\">Soon<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ st.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; opacity: 0.9\">Play now<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 13.2px; flex-wrap: wrap; align-items: center\">\n          <button sc-camel-on-click=\"{{ openPortal }}\" class=\"btn btn-secondary\" style=\"border-radius: 999px; font-weight: 800\">Grown-ups<\u002Fbutton>\n          <p style=\"margin: 0; font-size: 14px; font-weight: 600; color: var(--color-neutral-600)\">Numbers, Addition and Subtraction are open — the other stations are being built.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div ref=\"{{ confettiRef }}\" style=\"position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden\"><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;appTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mr. Riehl’s Math Lab&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showCounters&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;confetti&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;defaultMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;choice&quot;,&quot;keypad&quot;,&quot;visual&quot;],&quot;default&quot;:&quot;choice&quot;,&quot;tsType&quot;:&quot;'choice' | 'keypad' | 'visual'&quot;}}\">\nconst SETTINGS_KEY = 'mathstars_organic_settings_v1';\nconst PROFILE_KEY = 'mathstars_organic_profile_v1';\n\nconst OBJECT_ICONS = ['🍎', '🌟', '🐶', '⚽', '🍕', '🐱', '🚀', '🍓', '🎈', '🎨'];\n\nconst KID = [\n  { bg: '#1a9cf0', dark: '#0b6fb3' },\n  { bg: '#0fb26b', dark: '#0a8451' },\n  { bg: '#f59300', dark: '#c06f00' },\n  { bg: '#8b3ff0', dark: '#6a26c4' },\n  { bg: '#e8455c', dark: '#bd2b41' },\n  { bg: '#0891b2', dark: '#0a6f88' }\n];\nconst NUMFONT = 'var(--font-body)';\n\nconst W_ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',\n  'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];\nconst W_TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];\nfunction numberWords(n) {\n  n = Math.round(n);\n  if (n < 20) return W_ONES[n];\n  if (n < 100) { const r = n % 10; return W_TENS[Math.floor(n / 10)] + (r ? '-' + W_ONES[r] : ''); }\n  if (n < 1000) { const r = n % 100; return W_ONES[Math.floor(n / 100)] + ' hundred' + (r ? ' ' + numberWords(r) : ''); }\n  const r = n % 1000;\n  return numberWords(Math.floor(n / 1000)) + ' thousand' + (r ? ' ' + numberWords(r) : '');\n}\n\nconst STATIONS = [\n  { title: 'Numbers', glyph: '123', open: true, tab: 'numbers', tint: '#8b3ff0', shade: '#6a26c4' },\n  { title: 'Addition', glyph: '+', open: true, tab: 'game', tint: '#0fb26b', shade: '#0a8451' },\n  { title: 'Subtraction', glyph: '−', open: true, tab: 'sub', tint: '#e8455c', shade: '#bd2b41' },\n  { title: 'Multiplication', glyph: '×', tint: '#f59300' },\n  { title: 'Division', glyph: '÷', tint: '#0891b2' },\n  { title: 'AAD Math Reasoning', glyph: '?', tint: '#8b3ff0' },\n  { title: 'Functional Math Skills', glyph: '$', tint: '#0fb26b' },\n  {}, {}, {}, {}, {}, {}, {}, {}, {}\n];\n\nconst BADGES = [\n  { id: 'first_step', title: 'First Step', description: 'Solve your very first addition problem correctly.', req: 'Solve 1 problem' },\n  { id: 'high_five', title: 'High Five', description: 'Reach a streak of 5 correct answers in a row.', req: '5-in-a-row streak' },\n  { id: 'streak_master', title: 'Super Streak', description: 'Reach 10 correct answers in a row.', req: '10-in-a-row streak' },\n  { id: 'star_collector', title: 'Star Collector', description: 'Collect 25 shiny stars by answering questions.', req: 'Earn 25 stars' },\n  { id: 'level_3', title: 'Math Explorer', description: 'Reach Level 3 in Mr. Riehl’s Math Lab.', req: 'Reach Level 3' },\n  { id: 'level_5', title: 'Math Superhero', description: 'Reach Level 5 in Mr. Riehl’s Math Lab.', req: 'Reach Level 5' },\n  { id: 'zero_hero', title: 'Zero Hero', description: 'Master adding zero, like 5 + 0 = 5.', req: 'Solve 5 problems with 0' },\n  { id: 'double_trouble', title: 'Double Champ', description: 'Solve 5 doubles, like 4 + 4 or 3 + 3.', req: 'Solve 5 doubles' },\n  { id: 'century_solver', title: 'Century Master', description: 'Solve 50 math problems altogether.', req: 'Solve 50 problems' },\n  { id: 'accuracy_ace', title: 'Accuracy Ace', description: 'Keep 90% accuracy or better across 20+ problems.', req: '90%+ over 20 solved' }\n];\n\nconst AVATARS = [\n  { id: 'starry', name: 'Starry', emoji: '⭐', reqLevel: 1 },\n  { id: 'dino', name: 'Dino Kid', emoji: '🦖', reqLevel: 1 },\n  { id: 'cat', name: 'Whiskers', emoji: '🐱', reqLevel: 1 },\n  { id: 'robot', name: 'Beep Boop', emoji: '🤖', reqLevel: 2 },\n  { id: 'unicorn', name: 'Sparkle', emoji: '🦄', reqLevel: 3 },\n  { id: 'wizard', name: 'Merlin', emoji: '🧙', reqLevel: 4 },\n  { id: 'astronaut', name: 'Astro', emoji: '👩‍🚀', reqLevel: 5 },\n  { id: 'dragon', name: 'Flame', emoji: '🐉', reqLevel: 6 }\n];\n\nconst DEFAULT_SETTINGS = {\n  minDigit: 0, maxDigit: 9, sumLimit: 18, questionMode: 'choice',\n  voiceFeedback: true, soundEffects: true, voiceRate: 0.95, autoSpeak: true, parentPin: '1234'\n};\n\nfunction freshFamilies() {\n  const f = {};\n  for (let i = 0; i <= 9; i++) f[i] = { attempted: 0, correct: 0, totalTimeMs: 0 };\n  return f;\n}\n\nfunction defaultProfile() {\n  return {\n    avatarId: 'starry', stars: 0, xp: 0, level: 1, currentStreak: 0, bestStreak: 0,\n    totalSolved: 0, totalCorrect: 0, numLevel: 1, factFamilies: freshFamilies(),\n    unlockedBadges: [], unlockedAvatars: ['starry', 'dino', 'cat'], history: []\n  };\n}\n\nfunction loadJSON(key, fallback) {\n  try {\n    const raw = localStorage.getItem(key);\n    if (!raw) return fallback;\n    const parsed = JSON.parse(raw);\n    return Object.assign({}, fallback, parsed);\n  } catch (e) { return fallback; }\n}\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const settings = loadJSON(SETTINGS_KEY, DEFAULT_SETTINGS);\n    if (props && props.defaultMode && !localStorage.getItem(SETTINGS_KEY)) settings.questionMode = props.defaultMode;\n    const profile = loadJSON(PROFILE_KEY, defaultProfile());\n    profile.factFamilies = Object.assign(freshFamilies(), profile.factFamilies || {});\n    this.state = {\n      settings, profile, tab: 'game', portalOpen: false, pinOk: false, pinEntry: '', pinError: false,\n      problem: null, selected: null, keypad: '', feedback: null, counted: [], submitting: false,\n      badgeQueue: [], gateAnswer: '', portalTab: 'analytics', screen: 'splash', op: 'add',\n      numTarget: null, numOptions: [], numPicked: null, numFeedback: null, numRun: 0, numDone: 0, numRight: 0, voiceBlocked: false\n    };\n    this.confettiRef = React.createRef();\n    this.startTime = Date.now();\n    this.timers = [];\n  }\n\n  componentDidMount() {\n    this.gestured = false;\n    this.onGesture = () => {\n      if (this.gestured) return;\n      this.gestured = true;\n      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}\n    };\n    ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>\n      window.addEventListener(ev, this.onGesture, { capture: true }));\n    this.nextProblem();\n    this.newNumber();\n  }\n  componentWillUnmount() {\n    this.timers.forEach(clearTimeout);\n    if (this.onGesture) ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>\n      window.removeEventListener(ev, this.onGesture, { capture: true }));\n    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}\n  }\n\n  persist(patch) {\n    this.setState(patch, () => {\n      try {\n        localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.state.settings));\n        localStorage.setItem(PROFILE_KEY, JSON.stringify(this.state.profile));\n      } catch (e) {}\n    });\n  }\n\n  /* ---------- sound ---------- */\n  tone(freq, dur, type) {\n    if (!this.state.settings.soundEffects) return;\n    try {\n      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();\n      const o = this.ctx.createOscillator(), g = this.ctx.createGain();\n      o.type = type || 'sine';\n      o.frequency.value = freq;\n      g.gain.value = 0.09;\n      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);\n      o.connect(g).connect(this.ctx.destination);\n      o.start();\n      o.stop(this.ctx.currentTime + dur);\n    } catch (e) {}\n  }\n  sound(kind) {\n    if (kind === 'correct') { this.tone(660, 0.14); this.timers.push(setTimeout(() => this.tone(880, 0.22), 130)); }\n    else if (kind === 'wrong') { this.tone(300, 0.22, 'triangle'); }\n    else if (kind === 'badge') { [523, 659, 784, 1046].forEach((f, i) => this.timers.push(setTimeout(() => this.tone(f, 0.18), i * 110))); }\n    else this.tone(520, 0.07, 'square');\n  }\n  speak(text, force) {\n    const s = this.state.settings;\n    if (!force && !s.voiceFeedback) return;\n    const synth = window.speechSynthesis;\n    if (!synth) { if (force) this.setState({ voiceBlocked: true }); return; }\n    this.spoke = true;\n    // Browsers reject speech before the first real user gesture, and a rejected\n    // utterance wedges the queue (speaking stays true, nothing ever plays).\n    if (!this.gestured) return;\n    this.voiceSeq = (this.voiceSeq || 0) + 1;\n    const seq = this.voiceSeq;\n    const attempt = (tries) => {\n      if (seq !== this.voiceSeq) return;\n      try {\n        synth.cancel();\n        if (synth.paused) synth.resume();\n        const u = new SpeechSynthesisUtterance(String(text));\n        u.lang = 'en-US';\n        u.rate = s.voiceRate || 1;\n        u.pitch = 1.15;\n        u.volume = 1;\n        const voices = synth.getVoices() || [];\n        const pick = voices.filter(v => /^en/i.test(v.lang || ''))[0] || voices[0];\n        if (pick) u.voice = pick;\n        let started = false;\n        u.onstart = () => { started = true; if (this.state.voiceBlocked) this.setState({ voiceBlocked: false }); };\n        u.onerror = (e) => {\n          const kind = (e && e.error) || '';\n          if (kind === 'interrupted' || kind === 'canceled' || kind === 'cancelled') return;\n          if (tries < 2) { this.timers.push(setTimeout(() => attempt(tries + 1), 120)); return; }\n          if (force) this.setState({ voiceBlocked: true });\n        };\n        this.timers.push(setTimeout(() => synth.speak(u), 40));\n        // Silent wedge: queued but never started. Reset the engine and retry once.\n        this.timers.push(setTimeout(() => {\n          if (started || seq !== this.voiceSeq) return;\n          if (tries < 2) { synth.cancel(); attempt(tries + 1); }\n          else if (force) this.setState({ voiceBlocked: true });\n        }, 900));\n      } catch (e) {\n        if (force && tries >= 2) this.setState({ voiceBlocked: true });\n      }\n    };\n    if ((synth.getVoices() || []).length === 0) {\n      synth.onvoiceschanged = () => attempt(0);\n      this.timers.push(setTimeout(() => attempt(0), 300));\n    } else {\n      attempt(0);\n    }\n  }\n  speakNumber(n, force) { this.speak(numberWords(n), force); }\n  burst() {\n    if (this.props.confetti === false) return;\n    const host = this.confettiRef.current;\n    if (!host) return;\n    const colors = ['#1a9cf0', '#0fb26b', '#f59300', '#8b3ff0', '#fbbf24', '#e8455c'];\n    for (let i = 0; i < 26; i++) {\n      const p = document.createElement('div');\n      const size = 8 + Math.random() * 8;\n      p.style.cssText = 'position:absolute;top:32%;left:' + (35 + Math.random() * 30) + '%;width:' + size + 'px;height:' + size + 'px;border-radius:' + (Math.random() > 0.5 ? '999px' : '3px') + ';background:' + colors[i % colors.length] + ';animation:ms-fall ' + (0.9 + Math.random() * 0.7) + 's ease-in forwards;';\n      p.style.setProperty('--dx', (Math.random() * 340 - 170) + 'px');\n      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');\n      host.appendChild(p);\n      setTimeout(() => p.remove(), 1800);\n    }\n  }\n\n  /* ---------- game ---------- */\n  nextProblem(prev1, prev2) {\n    const s = this.state.settings, p = this.state.profile;\n    const lo = Math.min(s.minDigit, s.maxDigit), hi = Math.max(s.minDigit, s.maxDigit);\n    const pairs = [];\n    if (this.state.op === 'sub') {\n      for (let a = 0; a <= 9; a++) for (let b = 0; b <= a; b++) pairs.push([a, b]);\n    } else {\n      for (let a = lo; a <= hi; a++) for (let b = lo; b <= hi; b++) if (a + b <= s.sumLimit) pairs.push([a, b]);\n    }\n    if (!pairs.length) pairs.push([1, 1]);\n    const weighted = pairs.map(pair => {\n      const sa = p.factFamilies[pair[0]] || { attempted: 0, correct: 0 };\n      const sb = p.factFamilies[pair[1]] || { attempted: 0, correct: 0 };\n      const accA = sa.attempted > 0 ? sa.correct / sa.attempted : 0.5;\n      const accB = sb.attempted > 0 ? sb.correct / sb.attempted : 0.5;\n      let w = Math.max(1, Math.round((1.1 - (accA + accB) / 2) * 10));\n      if (pair[0] === prev1 && pair[1] === prev2) w = 1;\n      return { pair, w };\n    });\n    let total = weighted.reduce((a, c) => a + c.w, 0), r = Math.random() * total, chosen = weighted[0].pair;\n    for (const item of weighted) { if (r <= item.w) { chosen = item.pair; break; } r -= item.w; }\n    const sub = this.state.op === 'sub';\n    let num1 = chosen[0], num2 = chosen[1];\n    if (sub) {\n      if (num2 > num1) { const t = num1; num1 = num2; num2 = t; }\n      num1 = Math.min(9, num1); num2 = Math.min(num2, num1);\n    }\n    const answer = sub ? num1 - num2 : num1 + num2;\n    const cap = sub ? 9 : 18;\n    const set = new Set([answer]);\n    [answer + 1, answer - 1, answer + 2, answer - 2, answer + 3, num1, num2, Math.abs(num1 - num2)]\n      .filter(v => v >= 0 && v <= cap).sort(() => Math.random() - 0.5)\n      .forEach(v => { if (set.size < 4) set.add(v); });\n    let c = 0;\n    while (set.size < 4) { if (!set.has(c)) set.add(c); c++; }\n    const problem = {\n      num1, num2, answer, op: this.state.op,\n      options: Array.from(set).sort(() => Math.random() - 0.5),\n      icon: OBJECT_ICONS[Math.floor(Math.random() * OBJECT_ICONS.length)]\n    };\n    this.startTime = Date.now();\n    this.setState({ problem, selected: null, keypad: '', feedback: null, counted: [], submitting: false });\n    if (s.autoSpeak && s.voiceFeedback) this.speak('What is ' + num1 + (sub ? ' minus ' : ' plus ') + num2 + '?');\n  }\n\n  tapDot(id) {\n
